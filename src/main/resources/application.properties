spring.application.name=universidad

spring.datasource.url=jdbc:mysql://localhost:3306/Universidad
spring.datasource.username=root
spring.datasource.password=Temp2026
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

*Configuración para Hibernate (ORM) (Object Relational Mapping)*

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

*Creamos un directorio para subir archivos al servidor web (Apache Tomcat)*

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-part-count=100

