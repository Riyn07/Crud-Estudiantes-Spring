<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulario/Modificación Estudiante</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #111;
            font-family: system-ui, sans-serif;
            color: white;
            padding: 2rem;
        }

        h1 { margin-bottom: 1rem; }

        a {
            color: #4cafef;
            display: block;
            margin-bottom: 1.5rem;
        }

        fieldset {
            border: 1px solid #444;
            padding: 1.5rem;
            margin-bottom: 1rem;
            border-radius: 8px;
        }

        legend {
            padding: 0 0.5rem;
            color: #4cafef;
            font-weight: bold;
        }

        div { margin-bottom: 1rem; }

        label {
            display: block;
            margin-bottom: 0.3rem;
            font-size: 0.9rem;
            color: #ccc;
        }

        input, select {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border-radius: 6px;
            border: 1px solid #555;
            background-color: #222;
            color: white;
            font-size: 1rem;
        }

        input[type="submit"] {
            margin-top: 1rem;
            padding: 0.6rem 2rem;
            background-color: #4cafef;
            color: #000;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
        }

        input[type="submit"]:hover {
            background-color: #2a8fd4;
        }

        .error-bubble {
            display: inline-block;
            margin-top: 0.4rem;
            background-color: #c0392b;
            color: white;
            padding: 0.35rem 0.75rem;
            border-radius: 20px;
            font-size: 0.82rem;
        }

        .field-error {
            border-color: #c0392b !important;
            background-color: #2a1010 !important;
        }
    </style>
</head>

<body>

<h1>Formulario de Estudiante</h1>

<a th:href="@{/estudiantes/listar}">Listado</a>

<form th:action="@{/estudiantes/save}"
      th:object="${estudiante}"
      method="post"
      enctype="multipart/form-data">

    <input type="hidden" th:field="*{id}">

    <!-- ================= DATOS PERSONALES ================= -->
    <fieldset>
        <legend>Datos Personales</legend>

        <div>
            <label>Nombre</label>
            <input type="text" th:field="*{nombre}" required>
        </div>

        <div>
            <label>Primer Apellido</label>
            <input type="text" th:field="*{primerApellido}" required>
        </div>

        <div>
            <label>Segundo Apellido</label>
            <input type="text" th:field="*{segundoApellido}" required>
        </div>

        <div>
            <label>Género</label>
            <select th:field="*{genero}" required>
                <option value="">-- Selecciona --</option>
                <option value="MASCULINO">Masculino</option>
                <option value="FEMENINO">Femenino</option>
            </select>
        </div>

        <div>
            <label>Foto</label>
            <input type="file" name="file" accept="image/*">
        </div>
    </fieldset>

    <!-- ================= TELÉFONOS ================= -->
    <fieldset>
        <legend>Teléfonos</legend>

        <div th:each="tel, i : *{telefonos}">
            <input type="hidden" name="numerosTelefono" value="">
        </div>
    </fieldset>

    <!-- ================= CORREOS ================= -->
    <fieldset>
        <legend>Correos</legend>

        <div th:each="correo, i : *{emails}">
            <input type="hidden" name="direccionesCorreo" value="">
        </div>
    </fieldset>

    <!-- ================= ACADÉMICO ================= -->
    <fieldset>
        <legend>Datos Académicos</legend>

        <div>
            <label>Fecha Matriculación</label>
            <input type="date" th:field="*{fechaMatricula}" required>
        </div>

        <div>
            <label>Facultad</label>
            <select th:field="*{facultad.id}" required>
                <option value="">-- Selecciona --</option>
                <option th:each="fac : ${facultades}"
                        th:value="${fac.id}"
                        th:text="${fac.nombre}">
                </option>
            </select>
        </div>
    </fieldset>

    <input type="submit" value="Guardar">

</form>

</body>
</html>
